name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check the signing keystore
        run: |
          # A stable keystore is committed so every release is signed by the
          # same key. That is what lets a newer APK install over an older one,
          # and it avoids the stock debug certificate that some OEM ROMs refuse.
          test -f app/release.keystore || { echo "app/release.keystore is missing"; exit 1; }
          ls -l app/release.keystore
          keytool -list -keystore app/release.keystore -storepass android -alias ampkey \
            | grep -E "Alias name|Creation date|Certificate fingerprint"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify the release APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build tools: $BT"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          # Print the whole manifest summary so the log proves the
          # launcher activity, permissions and service are all present.
          "$BT/aapt" dump badging "$APK"

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/AccessibleMusicPlayer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk \
             artifacts/AccessibleMusicPlayer-release.apk
          ls -lh artifacts

      - name: Print APK checksums
        run: |
          cd artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          echo "File sizes:"
          stat -c '%n  %s bytes' *.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: accessible-music-player-apk
          path: artifacts/*.apk

      - name: Publish a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Accessible Music Player 1.0.${{ github.run_number }}
          body: |
            Accessible Music Player for Android.

            Download `AccessibleMusicPlayer-release.apk` below and open it on your
            phone to install. Android will ask you to allow installs from this
            source the first time.
          files: artifacts/*.apk
