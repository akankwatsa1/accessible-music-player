name: Generate Signing Keystore

# One-shot helper. Run it manually, download the produced keystore, commit it
# as app/release.keystore, then delete this workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create the keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass android \
            -alias ampkey \
            -keypass android \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Accessible Music Player, OU=Mobile, O=akankwatsa1, L=Kampala, ST=Kampala, C=UG"
          echo "--- certificate ---"
          keytool -list -v -keystore release.keystore -storepass android -alias ampkey \
            | grep -E 'Alias name|Owner|Valid from|SHA256:'
          echo "--- size ---"
          ls -l release.keystore
          sha256sum release.keystore

      - name: Upload the keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: release.keystore