name: Build Debug-Key Variant

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create a stock debug keystore
        run: |
          # Same identity as the standard Android debug certificate, which is
          # the key the working APK on this phone was signed with.
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storetype PKCS12 \
            -storepass android \
            -alias ampkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore app/release.keystore -storepass android -alias ampkey \
            | grep -E 'Alias name|Owner|SHA256:'
          sha256sum app/release.keystore

      - name: Build an arm64-only APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PabiFilter=arm64-v8a \
            -PversionSuffix=-arm64

      - name: Verify and collect
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion|native-code|launchable'
          mkdir -p artifacts
          cp "$APK" artifacts/MusicPlayer-debugkey-arm64.apk
          cp app/release.keystore artifacts/stock-debug.keystore
          cd artifacts && sha256sum * | tee SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: debugkey-variant
          path: artifacts/*

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debugkey-test-${{ github.run_number }}
          name: Debug-key test build ${{ github.run_number }}
          body: |
            A test build signed with the stock Android debug certificate and
            containing only arm64 libraries.
          files: artifacts/*